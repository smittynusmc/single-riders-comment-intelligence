version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: comment_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      SCI_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/comment_intelligence
      SCI_REDIS_URL: redis://redis:6379/0
      SCI_ALLOWED_ORIGINS: http://localhost:3000
      SCI_WORKER_MODE: rq
      SCI_LLM_PROVIDER: stub
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    working_dir: /app/apps/api
    ports:
      - "8000:8000"
    volumes:
      - ../apps/api:/app/apps/api
      - ../sample_data:/app/sample_data
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      SCI_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/comment_intelligence
      SCI_REDIS_URL: redis://redis:6379/0
      SCI_ALLOWED_ORIGINS: http://localhost:3000
      SCI_WORKER_MODE: rq
      SCI_LLM_PROVIDER: stub
    command: ["rq", "worker", "comment-intelligence", "--url", "redis://redis:6379/0"]
    working_dir: /app/apps/api
    volumes:
      - ../apps/api:/app/apps/api
      - ../sample_data:/app/sample_data
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      API_BASE_URL: http://api:8000
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    working_dir: /app/apps/web
    ports:
      - "3000:3000"
    volumes:
      - ../apps/web:/app/apps/web
      - ../packages/shared-types:/app/packages/shared-types
      - ../package.json:/app/package.json
    depends_on:
      - api

volumes:
  postgres_data:
